<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHAPTER1</title>
    <style>
        :root { --bg: #0e0e0e; --page-bg: #151515; --white-raw: 255, 255, 255; --spread-ratio: 1.33; --panel-bg: rgba(20, 20, 20, 0.95); --border-color: #333; --border-light: #222; --input-bg: #000; --text-main: #fff; }
        body.light-theme { --bg: #e5e5e5; --page-bg: #ffffff; --white-raw: 0, 0, 0; --panel-bg: rgba(255, 255, 255, 0.95); --border-color: #ccc; --border-light: #ddd; --input-bg: #fff; --text-main: #000; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg); margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; color: var(--text-main); }
        .book-container { width: 95%; max-width: 1400px; margin: 20px 0; }
        .book-spread { display: grid; grid-template-columns: 1fr 1fr; width: 100%; aspect-ratio: var(--spread-ratio); background: var(--page-bg); border: 1px solid var(--border-light); position: relative; overflow: hidden; }
        .book-spread::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: var(--border-light); z-index: 5; }
        .page { position: relative; display: flex; flex-direction: column; height: 100%; padding: 60px 80px; box-sizing: border-box; overflow: hidden; }
        @media (max-width: 900px) {
            .book-container { margin: 10px 0; width: 100%; }
            .book-spread { grid-template-columns: 1fr; aspect-ratio: auto !important; height: auto; border: none; overflow: visible; }
            .book-spread::before { display: none; }
            .page { padding: 40px 25px; height: auto; min-height: 400px; border-bottom: 1px solid var(--border-light); }
            .settings-panel { left: 0 !important; right: 0 !important; bottom: 0 !important; flex-direction: row !important; justify-content: space-between; width: 100%; border-left: none; border-right: none; padding: 15px 20px !important; box-sizing: border-box; }
            .footer-nav { margin-bottom: 100px; }
        }
        @media (max-width: 900px) and (orientation: landscape) {
            .book-spread { grid-template-columns: 1fr 1fr; aspect-ratio: var(--spread-ratio) !important; overflow: hidden; }
            .book-spread::before { display: block; } .page { padding: 30px; }
        }
        .content { width: 100%; height: 100%; overflow: hidden; }
        .content p { font-size: 1.1rem; line-height: 1.7; margin-bottom: 20px; color: rgba(var(--white-raw), 0.8); }
        .d { display: flex !important; background: rgba(var(--white-raw), 0.05); padding: 12px; border-radius: 4px; margin-bottom: 20px; font-weight: 500; }
        .d::before { content: ""; min-width: 4px; height: 1.2rem; background: rgba(var(--white-raw), 0.4); margin-right: 12px; }
        .no-padding { padding: 0 !important; }
        .no-padding img { width: 100%; height: 100%; display: block; object-fit: cover; }
        .center-block { display: flex; flex-direction: column; justify-content: center; align-items: center; width: 100%; height: 100%; text-align: center; padding: 20px 0; box-sizing: border-box; }
        .center-block p { text-align: center; font-style: italic; letter-spacing: 0.03em; color: rgba(var(--white-raw), 0.75); margin-bottom: 14px; font-size: 1.05rem; line-height: 1.8; }
        .page.center-page { justify-content: center; align-items: center; }
        .page.center-page .center-block { height: auto; }
        .settings-panel { position: fixed; bottom: 20px; right: 20px; z-index: 100; background: var(--panel-bg); backdrop-filter: blur(8px); padding: 12px; border: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 8px; font-size: 10px; text-transform: uppercase; letter-spacing: 1px; }
        select { background: var(--input-bg); color: var(--text-main); border: 1px solid var(--border-color); padding: 8px; cursor: pointer; outline: none; }
        .nav-zone { position: absolute; top: 0; bottom: 0; width: 40%; z-index: 10; cursor: pointer; }
        .left-zone { left: 0; } .right-zone { right: 0; }
        .footer-nav { margin: 20px 0 60px 0; z-index: 10; }
        .return-btn { text-decoration: none; color: rgba(var(--white-raw), 0.5); font-size: 12px; letter-spacing: 2px; padding: 12px 25px; border: 1px solid var(--border-color); transition: 0.3s; }
        .return-btn:hover { background: var(--text-main); color: var(--bg); }
        .spoiler-active img { filter: blur(60px) grayscale(1); transition: 0.3s; }
        .revealed img { filter: blur(0) grayscale(0) !important; }
        .spoiler-active:not(.revealed)::after { content: "SPOILER: CLICK TO REVEAL"; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.9); color: white; padding: 12px 20px; font-size: 11px; letter-spacing: 2px; z-index: 20; pointer-events: none; border: 1px solid #555; }
        #sandbox { position: fixed; visibility: hidden; top: -9999px; left: -9999px; overflow: hidden; }
    </style>
</head>
<body>
    <div class="settings-panel">
        <span>SPREAD RATIO:</span>
        <select id="ratioSelect" onchange="updateRatio(this.value)">
            <option value="1.33">4:3 (Default)</option>
            <option value="1.5">3:2</option>
            <option value="1.25">5:4</option>
        </select>
    </div>
    <div id="sandbox"></div>
    <div class="book-container">
        <main class="book-spread" id="spreadElement">
            <div class="nav-zone left-zone" onclick="prevPage()"></div>
            <div class="nav-zone right-zone" onclick="nextPage()"></div>
            <div id="spread-content-area" style="display: contents;"></div>
        </main>
    </div>
    <footer class="footer-nav"><a href="index.html" class="return-btn">RETURN TO MENU</a></footer>
<script>
    const PARSED_ELEMENTS = [{"type":"single-img","url":"image\\01\\Jay.jpg"},{"type":"center","data":"<div class=\"center-block\"><p><strong>In the loving memory of Jay</strong></p></div>"},{"type":"single-img","url":"image\\01\\1.jpg"},{"type":"single-img","url":"image\\01\\2.jpg"},{"type":"single-img","url":"image\\01\\3.jpg"},{"type":"single-img","url":"image\\01\\4.jpg"},{"type":"single-img","url":"image\\01\\5.jpg"},{"type":"single-img","url":"image\\01\\6.jpg"},{"type":"single-img","url":"image\\01\\seven.jpg"},{"type":"text","data":"<p>As you can see, our beloved Andy is currently taped to the front of a truck going at 100 km/h.</p>"},{"type":"text","data":"<p>This is definitely far superior to any alarm clock you can find at IKEA.</p>"},{"type":"text","data":"<p class=\"d\">ANDY: Whar.</p>"},{"type":"text","data":"<p>A flying sheet of a wanted poster of a literal nobody criminal scum smacked his face.</p>"},{"type":"text","data":"<p><em>Ooooh.</em></p>"},{"type":"text","data":"<p><em>So from what I can see... I’m in the middle of a highway.</em></p>"},{"type":"text","data":"<p><em>And I’m taped to the bumper of a speeding truck.</em></p>"},{"type":"text","data":"<p>...</p>"},{"type":"text","data":"<p class=\"d\">ANDY: YO WHHHAAAAT TTTHHHHHHHHHHEEEEEEEEEEEEEEEE FUUUCCCCCCCCCCKKKKKKKKKKKKKKKKK</p>"},{"type":"text","data":"<p class=\"d\">ANDY: YOU TORTILLA LOOKING ASS PUT ME DOWN RIIIGHHTT NOOOOOWWWWWWWWWWWWWWW</p>"},{"type":"text","data":"<p>Andy felt... absolutely terrible.</p>"},{"type":"text","data":"<p>No way he got done like that in his sleep. Like, sure, he sleeps like a corpse, but being taped to the front of a truck and still not waking up has surely got to be a side effect of sleep deprivation from all those late-night gaming sessions.</p>"},{"type":"text","data":"<p>Eitherway, the truck driver, a hideous man with a mohawk and black tattoo imprints plastered all over his face, had his jaw unhinged the entire time.</p>"},{"type":"text","data":"<p>His eyes weren't focused on the road at all. He was screaming in joy.</p>"},{"type":"text","data":"<p class=\"d\">MOHAWK: “BIG CATCH, BIG CATCH, A BIG HIT OF THE UNDERWORLD IS TAPED TO THE FRONT OF A TRUCK!!!”</p>"},{"type":"text","data":"<p>He slammed his palm on the steering wheel several times, sending out a cluster of horn blares.</p>"},{"type":"text","data":"<p class=\"d\">MOHAWK: “HAHAHAH I NEVER THOUGHT THIS WAR WOULD BE SO FUN!!!”</p>"},{"type":"text","data":"<p>Without remorse, the truck rams over a few cars in front including a small hatchback, a family SUV, and another hatchback with a probationary sticker on the back window.</p>"},{"type":"text","data":"<p>A cluster of skinless hands manifests in front of Andy, absorbing the impact like cushions. Andy managed to survive getting hit by all three cars.</p>"},{"type":"text","data":"<p>The tape restraining him began to come loose from the crash.</p>"},{"type":"text","data":"<p>He wiggled his body around aggressively.</p>"},{"type":"text","data":"<p>Finally, the duct tape tears apart.</p>"},{"type":"text","data":"<p>Andy went flying to the side of the truck, he was already braced for the landing when the driver's hand caught him by the wrist.</p>"},{"type":"text","data":"<p>The bandages on Andy's hand slid down by a modicum.</p>"},{"type":"text","data":"<p class=\"d\">MOHAWK: “BY CLAIMING THAT PRICE TAG ON YOUR HEAD, 'WE,' AND I MEAN OUR ENTTIIIREEEE FAAACTION WILL BE ABLE TO LIVE WITHOUT WORRY FOREVER! WE'LL HAVE EVERYTHING!!! EEEVERYTTHIINNGGGG!!!!!!!!!”</p>"},{"type":"text","data":"<p>Andy's face crumpled into a look of fear and sheer disgust.</p>"},{"type":"text","data":"<p class=\"d\">ANDY: I just want to live a normal life! Why do you guys always come and ruin my fucking peace-bubble!?!!!</p>"},{"type":"text","data":"<p>The driver looked at Andy's reflection in the side mirror for a second.</p>"},{"type":"text","data":"<p>He adjusted the mirror.</p>"},{"type":"text","data":"<p>...</p>"},{"type":"text","data":"<p class=\"d\">MOHAWK: BAHAHAHAHAHAHAHH!!! ARE YOU FUCKING WITH ME!?!?? YOU!? ‘PEACE’!? AAAHAHAHAHGHGHAHGHHH</p>"},{"type":"text","data":"<p>He choked on his own saliva and started coughing non-stop.</p>"},{"type":"text","data":"<p>Beneath the dashboard, a pair of skinless hands emerges from the gearbox. They hop onto the pedals and begin aggressively juggling the brake and accelerator.</p>"},{"type":"text","data":"<p><strong>SLAM. SLAM.</strong></p>"},{"type":"text","data":"<p><strong>SLAM. SLAM.</strong></p>"},{"type":"text","data":"<p>The truck came to an abrupt stop, moved forward once again, stopped, and moved again for a bit.</p>"},{"type":"text","data":"<p>The truck was in a chaotic state.</p>"},{"type":"text","data":"<p>The driver lost his grip on Andy’s hand.</p>"},{"type":"text","data":"<p>He stomped down on both the hands until they were nothing more than bloody chunks of flesh.</p>"},{"type":"text","data":"<p>He seems more worried about the truck's condition than of seeing literal detached semi-sentient ugly hands underneath him.</p>"},{"type":"text","data":"<p>Mister driver right here looked at the side mirror.</p>"},{"type":"text","data":"<p><em>Tch. He’s gone... Don’t see his body on the ground...</em></p>"},{"type":"text","data":"<p>He slammed on the horn.</p>"},{"type":"text","data":"<p class=\"d\">MOHAWK: “HEY! Get your asses off of the roof and check the trailer! Useless fucking tards!”</p>"},{"type":"text","data":"<p>Above the truck on the trailer were three men in ski masks.</p>"},{"type":"text","data":"<p>One of the three men punched another's elbow lightly. He pointed towards the trailer they were standing on.</p>"},{"type":"text","data":"<p>The other person took a step back as he whipped his pistol out.</p>"},{"type":"text","data":"<p>One of them, the one with an uglier ski mask, moved first. He hopped off and grabbed the top hood, swinging himself in the trailer.</p>"},{"type":"text","data":"<p>Inside, there were a bunch of skinless hands stuck to the walls inside like an infestation of cockroaches.</p>"},{"type":"text","data":"<p>He whipped his weapon out in shock, actively keeping distance from the walls.</p>"},{"type":"text","data":"<p>Andy appeared behind him, already winding up a punch.</p>"},{"type":"text","data":"<p>It missed. Though, Andy did not stop attacking.</p>"},{"type":"text","data":"<p>He sent a left jab twice that also missed. Then, a right hook that landed on his target’s chest.</p>"},{"type":"text","data":"<p>The man tried swinging his pistol, but Andy hopped back. The man fired a shot, two shots.</p>"},{"type":"text","data":"<p>Andy dodged both bullets and slapped the man’s arm.</p>"},{"type":"text","data":"<p><strong>SMACK.</strong></p>"},{"type":"text","data":"<p>Andy punched him awfully hard, causing him to stagger back slightly.</p>"},{"type":"text","data":"<p>Andy dashed forward and thrashed his face with jabs and punches, gradually pushing the man against the wall.</p>"},{"type":"text","data":"<p>When the man finally got too close to the adjacent wall, the hands sitting dormant leeched onto his throat.</p>"},{"type":"text","data":"<p>Its fingers pressed in deeper and deeper until they punctured his neck, causing blood to spill like a water-filled plastic bag with tiny holes.</p>"},{"type":"text","data":"<p>Another challenger appeared from behind Andy. One hand went flying and slammed the man’s head onto the wall, straight up crushing his skull.</p>"},{"type":"text","data":"<p><strong>BANG. BANG. BANG.</strong></p>"},{"type":"text","data":"<p>Gunshots came from above. None of it hit though.</p>"},{"type":"text","data":"<p><em>There’s one more guy up there.</em></p>"},{"type":"text","data":"<p><em>He's trying to play it safe...</em></p>"},{"type":"text","data":"<p><strong>THUMP.</strong></p>"},{"type":"text","data":"<p><strong>SLAM.</strong></p>"},{"type":"text","data":"<p><strong>CRASHHHH.</strong></p>"},{"type":"text","data":"<p>A body dropped from the trailer. Andy noticed that a patch of skinless hands on the walls had already disappeared.</p>"},{"type":"text","data":"<p>Andy let out a gruff exhale.</p>"},{"type":"text","data":"<p>Starting to feel nauseous, his body swayed lightly. He covered his face, whispering under his breath.</p>"},{"type":"text","data":"<p class=\"d\">ANDY: Fuck this... I just want a normal life, I just want a normal life, I just want a normal life, I just want a normal life...</p>"},{"type":"text","data":"<p>The truck was speeding up, even going airborne for a split second.</p>"},{"type":"center","data":"<div class=\"center-block\"><p>A supernatural, diverse phenomenon amongst individuals, something that is caused by one's forcibly altered biology and a mystical touch.</p><p>Only in ≈0.008–0.05% of individuals, a spontaneous genomic variance results in a strange combination of genes.</p><p>An otherworldly disturbance would visit those who die unsatisfactorily.</p><p>Resulting in what is known as 'Oddities'.</p></div>"},{"type":"single-img","url":"image\\01\\8.jpg"},{"type":"single-img","url":"image\\01\\9.jpg"},{"type":"text","data":"<p><em>Fool's Loophole</em> rushed towards Andy, enveloping him in a defensive cocoon.</p>"},{"type":"text","data":"<p>The hands splattered outward when he tumbled on the ground.</p>"},{"type":"text","data":"<p>He came out unscathed for the most part. The only injuries worth accounting for were the torn skin and ringing ears if those even counted, and maybe the fact that there were three trucks through his eyes, slowly converging as his vision steadied back together.</p>"},{"type":"text","data":"<p>He pushed himself forward using his forearms instead.</p>"},{"type":"text","data":"<p>He was coughing off dust as he took gentle steps towards his beanie that had gone flying and landed in between two pieces of large rubble.</p>"},{"type":"text","data":"<p><em>...This is how it should be.</em></p>"},{"type":"text","data":"<p><em>It’s better this way.</em></p>"},{"type":"text","data":"<p><em>Just like this.</em></p>"},{"type":"text","data":"<p>He straightened up before sucking in air through his nose and mouth until it felt satisfactory.</p>"},{"type":"text","data":"<p>Andy was flipping off the crowd of cars stacked in front of him without realizing it, but even if he did become aware of it, he wouldn't give a shit. He'd had enough of his inner harmony being violated without consent.</p>"},{"type":"text","data":"<p>One of the car honks stood out. A familiar voice called after him.</p>"},{"type":"text","data":"<p><strong>“YOO”</strong></p>"},{"type":"text","data":"<p>Andy looked over where the voice came from.</p>"},{"type":"text","data":"<p>There was a dude in office attire, wearing those unremarkable one-sided glasses along with a curtain cut.</p>"},{"type":"paired-double","left":"image\\01\\11.jpg","right":"image\\01\\12.jpg"},{"type":"paired-double","left":"image\\01\\white.jpg","right":"image\\01\\thanks.jpg"}];
    let PAGINATED_PAGES = [];
    let currentSpread = 0;

    function reflowContent() {
        if (PARSED_ELEMENTS.length === 0) return;

        if (window.innerWidth <= 900 && window.innerHeight > window.innerWidth) {
            PAGINATED_PAGES = [];
            let blockBuffer = "";
            PARSED_ELEMENTS.forEach(el => {
                if (el.type === 'paired-double') {
                    if (blockBuffer !== "") { PAGINATED_PAGES.push({ type: 'text', data: blockBuffer }); blockBuffer = ""; }
                    PAGINATED_PAGES.push({ type: 'single', data: '<img src="' + el.left + '">' });
                    PAGINATED_PAGES.push({ type: 'single', data: '<img src="' + el.right + '">' });
                } else if (el.type === 'single-img') {
                    if (blockBuffer !== "") { PAGINATED_PAGES.push({ type: 'text', data: blockBuffer }); blockBuffer = ""; }
                    PAGINATED_PAGES.push({ type: 'single', data: '<img src="' + el.url + '">' });
                } else if (el.type === 'center') {
                    if (blockBuffer !== "") { PAGINATED_PAGES.push({ type: 'text', data: blockBuffer }); blockBuffer = ""; }
                    PAGINATED_PAGES.push({ type: 'center', data: el.data });
                } else {
                    blockBuffer += el.data || el;
                }
            });
            if (blockBuffer !== "") PAGINATED_PAGES.push({ type: 'text', data: blockBuffer });
            currentSpread = 0;
            updateUI();
            return;
        }

        const bookSpread = document.querySelector('.book-spread');
        const spreadWidth = bookSpread.clientWidth;
        if (!spreadWidth || spreadWidth === 0) { requestAnimationFrame(() => reflowContent()); return; }

        const ratio = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--spread-ratio')) || 1.33;
        const spreadHeight = spreadWidth / ratio;
        const targetWidth = (spreadWidth / 2) - 1;
        const pageHeight = spreadHeight - 2;

        const sandbox = document.getElementById('sandbox');
        sandbox.innerHTML = '<article class="page" style="width:' + targetWidth + 'px; height:' + pageHeight + 'px; padding:60px 80px; box-sizing:border-box; overflow:hidden;"><div class="content" id="sand-c" style="width:100%; height:100%; overflow:hidden;"></div></article>';
        const sandC = document.getElementById('sand-c');
        const maxHeight = sandC.offsetHeight;

        if (!maxHeight || maxHeight === 0) {
            sandbox.innerHTML = "";
            requestAnimationFrame(() => reflowContent());
            return;
        }

        PAGINATED_PAGES = [];
        let currentPageBuffer = "";

        function flushTextBuffer() {
            if (currentPageBuffer !== "") {
                PAGINATED_PAGES.push({ type: 'text', data: currentPageBuffer });
                currentPageBuffer = "";
            }
        }

        PARSED_ELEMENTS.forEach(element => {
            if (element.type === 'paired-double') {
                flushTextBuffer();
                if (PAGINATED_PAGES.length % 2 !== 0) PAGINATED_PAGES.push({ type: 'empty', data: "" });
                PAGINATED_PAGES.push({ type: 'single', data: '<img src="' + element.left + '">' });
                PAGINATED_PAGES.push({ type: 'single', data: '<img src="' + element.right + '">' });
                return;
            }
            if (element.type === 'single-img') {
                flushTextBuffer();
                PAGINATED_PAGES.push({ type: 'single', data: '<img src="' + element.url + '">' });
                return;
            }
            if (element.type === 'center') {
                flushTextBuffer();
                PAGINATED_PAGES.push({ type: 'center', data: element.data });
                return;
            }
            let inlineMarkup = element.data;
            sandC.innerHTML = currentPageBuffer + inlineMarkup;
            if (sandC.scrollHeight > maxHeight && currentPageBuffer !== "") {
                PAGINATED_PAGES.push({ type: 'text', data: currentPageBuffer });
                currentPageBuffer = inlineMarkup;
            } else {
                currentPageBuffer += inlineMarkup;
            }
        });

        flushTextBuffer();
        sandbox.innerHTML = "";
        currentSpread = 0;
        updateUI();
    }

    function renderPage(pageData, id) {
        if (!pageData) return '<article class="page" id="' + id + '"></article>';
        if (pageData.type === 'single') return '<article class="page no-padding" id="' + id + '">' + pageData.data + '</article>';
        if (pageData.type === 'center') return '<article class="page center-page" id="' + id + '"><div class="content">' + pageData.data + '</div></article>';
        if (pageData.type === 'text') return '<article class="page" id="' + id + '"><div class="content">' + pageData.data + '</div></article>';
        return '<article class="page" id="' + id + '"></article>';
    }

    function updateUI() {
        const container = document.getElementById('spread-content-area');
        container.innerHTML = "";
        if (PAGINATED_PAGES.length === 0) return;
        const isMobileView = window.innerWidth <= 900 && window.innerHeight > window.innerWidth;
        const bookSpreadElement = document.getElementById('spreadElement');
        if (isMobileView) {
            bookSpreadElement.style.display = "block"; bookSpreadElement.style.border = "none";
            const currentItem = PAGINATED_PAGES[currentSpread]; if (!currentItem) return;
            if (currentItem.type === 'single') { container.innerHTML = '<article class="page no-padding">' + currentItem.data + '</article>'; }
            else if (currentItem.type === 'center') { container.innerHTML = '<article class="page center-page"><div class="content">' + currentItem.data + '</div></article>'; }
            else { container.innerHTML = '<article class="page"><div class="content">' + currentItem.data + '</div></article>'; }
            handleSpoilerState(container); return;
        }
        bookSpreadElement.style.display = "grid"; bookSpreadElement.style.border = "1px solid var(--border-light)";
        const leftIndex = currentSpread * 2; const rightIndex = leftIndex + 1;
        const leftPageData = PAGINATED_PAGES[leftIndex]; const rightPageData = PAGINATED_PAGES[rightIndex];
        let leftHtml = renderPage(leftPageData, 'L-PAGE');
        let rightHtml = rightPageData ? renderPage(rightPageData, 'R-PAGE') : '<article class="page" id="R-PAGE" style="display:none;"></article>';
        container.innerHTML = leftHtml + rightHtml;
        handleSpoilerState(container);
    }

    function handleSpoilerState(container) {
        const isSpoilerOn = localStorage.getItem('spoiler-mode') === 'true';
        const pages = container.querySelectorAll('.page');
        pages.forEach(page => {
            if (isSpoilerOn && page.classList.contains('no-padding')) {
                page.classList.add('spoiler-active');
                page.onclick = (e) => { if (page.classList.contains('spoiler-active') && !page.classList.contains('revealed')) { e.stopPropagation(); page.classList.add('revealed'); } };
            }
        });
    }

    function nextPage() {
        const isMobileView = window.innerWidth <= 900 && window.innerHeight > window.innerWidth;
        const activeSpoiler = document.querySelector('.spoiler-active:not(.revealed)');
        if (activeSpoiler) { activeSpoiler.classList.add('revealed'); return; }
        if (isMobileView) { if (currentSpread + 1 < PAGINATED_PAGES.length) { currentSpread++; updateUI(); window.scrollTo({ top: 0 }); } }
        else { if ((currentSpread + 1) * 2 < PAGINATED_PAGES.length) { currentSpread++; updateUI(); window.scrollTo({ top: 0 }); } }
    }

    function prevPage() { if (currentSpread > 0) { currentSpread--; updateUI(); window.scrollTo({ top: 0 }); } }

    function updateRatio(val) {
        if (val !== "1.33" && val !== "1.5" && val !== "1.25") val = "1.33";
        document.documentElement.style.setProperty('--spread-ratio', val);
        document.body.setAttribute('data-ratio', val);
        localStorage.setItem('individuals-ratio', val);
        setTimeout(() => reflowContent(), 100);
    }

    window.addEventListener('resize', () => setTimeout(() => reflowContent(), 100));

    window.onload = () => {
        if (localStorage.getItem('site-theme') === 'light') document.body.classList.add('light-theme');
        let saved = localStorage.getItem('individuals-ratio') || "1.33";
        if (saved !== "1.33" && saved !== "1.5" && saved !== "1.25") saved = "1.33";
        document.getElementById('ratioSelect').value = saved;
        updateRatio(saved);
    };</script>
</body>
</html>
