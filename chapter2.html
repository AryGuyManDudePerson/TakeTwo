<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHAPTER2.</title>
    <style>
        :root { --bg: #0e0e0e; --page-bg: #151515; --white-raw: 255, 255, 255; --spread-ratio: 1.33; --panel-bg: rgba(20, 20, 20, 0.95); --border-color: #333; --border-light: #222; --input-bg: #000; --text-main: #fff; }
        body.light-theme { --bg: #e5e5e5; --page-bg: #ffffff; --white-raw: 0, 0, 0; --panel-bg: rgba(255, 255, 255, 0.95); --border-color: #ccc; --border-light: #ddd; --input-bg: #fff; --text-main: #000; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg); margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; color: var(--text-main); }
        .book-container { width: 95%; max-width: 1400px; margin: 20px 0; }
        .book-spread { display: grid; grid-template-columns: 1fr 1fr; width: 100%; aspect-ratio: var(--spread-ratio); background: var(--page-bg); border: 1px solid var(--border-light); position: relative; overflow: hidden; }
        .book-spread::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: var(--border-light); z-index: 5; }
        .page { position: relative; display: flex; flex-direction: column; height: 100%; padding: 60px 80px; box-sizing: border-box; overflow: hidden; }
        @media (max-width: 900px) {
            .book-container { margin: 10px 0; width: 100%; }
            .book-spread { grid-template-columns: 1fr; aspect-ratio: auto !important; height: auto; border: none; overflow: visible; }
            .book-spread::before { display: none; }
            .page { padding: 40px 25px; height: auto; min-height: 400px; border-bottom: 1px solid var(--border-light); }
            .settings-panel { left: 0 !important; right: 0 !important; bottom: 0 !important; flex-direction: row !important; justify-content: space-between; width: 100%; border-left: none; border-right: none; padding: 15px 20px !important; box-sizing: border-box; }
            .footer-nav { margin-bottom: 100px; }
        }
        @media (max-width: 900px) and (orientation: landscape) {
            .book-spread { grid-template-columns: 1fr 1fr; aspect-ratio: var(--spread-ratio) !important; overflow: hidden; }
            .book-spread::before { display: block; } .page { padding: 30px; }
        }
        .content { width: 100%; height: 100%; overflow: hidden; }
        .content p { font-size: 1.1rem; line-height: 1.7; margin-bottom: 20px; color: rgba(var(--white-raw), 0.8); }
        .d { display: flex !important; background: rgba(var(--white-raw), 0.05); padding: 12px; border-radius: 4px; margin-bottom: 20px; font-weight: 500; }
        .d::before { content: ""; min-width: 4px; height: 1.2rem; background: rgba(var(--white-raw), 0.4); margin-right: 12px; }
        .no-padding { padding: 0 !important; }
        .no-padding img { width: 100%; height: 100%; display: block; object-fit: cover; }
        .settings-panel { position: fixed; bottom: 20px; right: 20px; z-index: 100; background: var(--panel-bg); backdrop-filter: blur(8px); padding: 12px; border: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 8px; font-size: 10px; text-transform: uppercase; letter-spacing: 1px; }
        select { background: var(--input-bg); color: var(--text-main); border: 1px solid var(--border-color); padding: 8px; cursor: pointer; outline: none; }
        .nav-zone { position: absolute; top: 0; bottom: 0; width: 40%; z-index: 10; cursor: pointer; }
        .left-zone { left: 0; } .right-zone { right: 0; }
        .footer-nav { margin: 20px 0 60px 0; z-index: 10; }
        .return-btn { text-decoration: none; color: rgba(var(--white-raw), 0.5); font-size: 12px; letter-spacing: 2px; padding: 12px 25px; border: 1px solid var(--border-color); transition: 0.3s; }
        .return-btn:hover { background: var(--text-main); color: var(--bg); }
        .spoiler-active img { filter: blur(60px) grayscale(1); transition: 0.3s; }
        .revealed img { filter: blur(0) grayscale(0) !important; }
        .spoiler-active:not(.revealed)::after { content: "SPOILER: CLICK TO REVEAL"; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.9); color: white; padding: 12px 20px; font-size: 11px; letter-spacing: 2px; z-index: 20; pointer-events: none; border: 1px solid #555; }
        #sandbox { position: fixed; visibility: hidden; top: -9999px; left: -9999px; overflow: hidden; }
    </style>
</head>
<body>
    <div class="settings-panel">
        <span>SPREAD RATIO:</span>
        <select id="ratioSelect" onchange="updateRatio(this.value)">
            <option value="1.33">4:3 (Default)</option>
            <option value="1.5">3:2</option>
            <option value="1.25">5:4</option>
        </select>
    </div>
    <div id="sandbox"></div>
    <div class="book-container">
        <main class="book-spread" id="spreadElement">
            <div class="nav-zone left-zone" onclick="prevPage()"></div>
            <div class="nav-zone right-zone" onclick="nextPage()"></div>
            <div id="spread-content-area" style="display: contents;"></div>
        </main>
    </div>
    <footer class="footer-nav"><a href="index.html" class="return-btn">RETURN TO MENU</a></footer>
<script>
    const PARSED_ELEMENTS = [{"type":"paired-double","left":"image/02/1.jpg","right":"image/02/2.jpg"},{"type":"text","data":"<p>The door handle clicked uselessly in Andy's grip.</p>"},{"type":"text","data":"<p class=\"d\">SAI: \"You know that shit's locked from the inside.\"</p>"},{"type":"text","data":"<p>Andy once again shook the door handle even harder than last time, only letting go when Sai swerved his vehicle abruptly, forcing Andy to sink into the passenger seat with a thousand-yard stare.</p>"},{"type":"text","data":"<p class=\"d\">SAI: \"Yeah, I tuned it that way.\"</p>"},{"type":"text","data":"<p>Sai reached for the radio, eyes still on the road.</p>"},{"type":"text","data":"<p>['People continued to protest as Grave Tax continues to skyrocket. Nature Conservancy warns of severe environmental effects if corpses are continued to be disposed of through—']</p>"},{"type":"text","data":"<p><strong>Click.</strong></p>"},{"type":"text","data":"<p>['The ongoing war does not appear to show any signs of de-escala—']</p>"},{"type":"text","data":"<p><strong>Click. </strong></p>"},{"type":"text","data":"<p>['Come get a job! Starting from only four dollars an hour! Apply at—']</p>"},{"type":"text","data":"<p><strong>Click.</strong></p>"},{"type":"text","data":"<p>Sai pulled a long breath out through his nose and let it die somewhere on the dashboard.</p>"},{"type":"text","data":"<p class=\"d\">SAI: \"...Why have you been neglecting us?\"</p>"},{"type":"text","data":"<p>It didn't really feel like a question.</p>"},{"type":"text","data":"<p class=\"d\">ANDY: \"You can drop me off at the nearest Arby's.\"</p>"},{"type":"text","data":"<p class=\"d\">ANDY: \"I'll walk from there.\"</p>"},{"type":"text","data":"<p class=\"d\">SAI: \"Andy.\"</p>"},{"type":"text","data":"<p class=\"d\">ANDY: \"I'm just saying. It's an option.\"</p>"},{"type":"text","data":"<p>Sai's thumbs rolled over the steering wheel.</p>"},{"type":"text","data":"<p class=\"d\">SAI: \"You haven't picked up my calls.\"</p>"},{"type":"text","data":"<p class=\"d\">SAI: \"Not Kj's. Not anyone's.\"</p>"},{"type":"text","data":"<p class=\"d\">SAI: \"Have you given up on us?\"</p>"},{"type":"text","data":"<p class=\"d\">ANDY: \"Nah.\"</p>"},{"type":"text","data":"<p class=\"d\">ANDY: \"I still care about all of you.\"</p>"},{"type":"text","data":"<p>Sai sucked his lips in. Both palms came down flat on the steering wheel rim. His voice evened out.</p>"},{"type":"text","data":"<p class=\"d\">SAI: \"Alright then.\"</p>"},{"type":"text","data":"<p class=\"d\">SAI: \"When is my birthday?\"</p>"},{"type":"text","data":"<p>Andy stared ahead. He rubbed his eye with the back of his wrist. Slowly, almost like he was hoping the answer would materialise if he just shifted his weight enough, he turned toward the door and pulled the handle again.</p>"},{"type":"text","data":"<p>To no avail...</p>"},{"type":"text","data":"<p class=\"d\">SAI: \"It's today, Andy.\"</p>"},{"type":"text","data":"<p>Andy let go of the handle and settled back.</p>"},{"type":"text","data":"<p class=\"d\">ANDY: \"Look.\"</p>"},{"type":"text","data":"<p class=\"d\">ANDY: \"I've matured. I'm past all of that. The life we were living is just... dangerous.\"</p>"},{"type":"text","data":"<p class=\"d\">ANDY: \"I'm trying to get back to something normal. That's all I want.\"</p>"},{"type":"text","data":"<p class=\"d\">SAI: \"I'm not buying into that.\"</p>"},{"type":"text","data":"<p class=\"d\">SAI: \"That's a worse lie than saying my ballsack is uneven.\"</p>"},{"type":"text","data":"<p>Andy opened his mouth. Closed it. Nevermind. Under literally any other circumstances he would have had something for that.</p>"},{"type":"text","data":"<p class=\"d\">SAI: \"Just come through for your homeboy's birthday.\"</p>"},{"type":"text","data":"<p class=\"d\">SAI: \"All I'm asking for.\"</p>"},{"type":"text","data":"<p>Andy made sure his mouth remained shut. He found Sai's reflection sitting in the side mirror on the driver's door and just looked at it for a while.</p>"},{"type":"text","data":"<p>Sai pulled up and cut the engine. He patted Andy once on the back, nodding ahead toward the door. Andy got up then walked up to the entrance, stopped, and rested his bandaged hand on the doorknob.</p>"},{"type":"text","data":"<p>Then he turned around and started walking the other way.</p>"},{"type":"text","data":"<p>Sai watched him from the driveway with an expression that had given up trying to understand.</p>"},{"type":"text","data":"<p>Andy made it about four steps before he walked directly into someone and collapsed.</p>"},{"type":"text","data":"<p>That someone in question remained standing. She looked down at Andy on the ground with the same expression she probably used to read receipts. Butterfly shaped sweater, at least some parts of it. Butterfly clip on her beret. The whole fucking leitmotif was just based on butterflies.</p>"},{"type":"text","data":"<p class=\"d\">ANDY: \"Kj what the fu—\"</p>"},{"type":"text","data":"<p>Kj reached down and grabbed him by the sweater, dragging him across the textured brick pavement.</p>"},{"type":"single-img","url":"image/02/3.jpg"},{"type":"text","data":"<p class=\"d\">SAI: \"Come on, everybody misses you.\"</p>"},{"type":"text","data":"<p>Sai nudged the door open.</p>"},{"type":"text","data":"<p>The first thing that happened was everyone looked at Andy.</p>"},{"type":"text","data":"<p>The second thing that happened was everyone stopped looking at Andy and went back to whatever they were doing.</p>"},{"type":"text","data":"<p>Ary and Dennis were cross-legged on the floor in front of the TV, controllers in hand, playing a match of <em>Super Smash Bros.</em>. Hieu was draped across the couch above them, dangling a bag of <em>Lay's</em> down toward Dennis without looking away from the screen.</p>"},{"type":"text","data":"<p>Dennis opened his mouth and Hieu fed him a potato chip.</p>"},{"type":"text","data":"<p class=\"d\">ZHIYNL: \"Yo can you not do that.\"</p>"},{"type":"text","data":"<p>Zhiynl said from the other end of the couch, staring at the game.</p>"},{"type":"text","data":"<p class=\"d\">ZHIYNL: \"That's literally the gayest shit I've seen since watching my dad shop at IKEA.\"</p>"},{"type":"text","data":"<p>Dennis opened his mouth to say something, perhaps to demand another chip.</p>"},{"type":"text","data":"<p class=\"d\">ZHIYNL: \"YO FUCKING COME HE—\"</p>"},{"type":"text","data":"<p>Zhiynl lunged forward to grab the bag of chips. The couch tipped. The couch crashed. Dust, salty chips, pillows, controllers and a stray kitchen knife kicked up into the air, singlehandedly throwing everyone's dignity out the window.</p>"},{"type":"text","data":"<p>From the kitchen, a girl — along with a fire extinguisher — came flying out of the doorway. Her head caught the edge of a stool. She stayed there consciously with the fire extinguisher sitting on her face.</p>"},{"type":"text","data":"<p>Win came out right after her to grab the fire extinguisher. He glanced over at the door, took notice of the trio.</p>"},{"type":"text","data":"<p class=\"d\">WIN: \"Hey.\"</p>"},{"type":"text","data":"<p>He waddled his ass back into the kitchen.</p>"},{"type":"text","data":"<p>Andy stood in the entrance and took in the room.</p>"},{"type":"text","data":"<p>Sai gave him one pat on the shoulder, then disappeared into the kitchen. Somewhere between the door and the dining table, Kj had also vanished, reappearing already seated, picking through the food like she's defusing a bomb. She pulled a slice of watermelon off the plate and held it out toward Andy without looking up.</p>"},{"type":"text","data":"<p class=\"d\">KJ: \"Have a slice.\"</p>"},{"type":"text","data":"<p>Andy walked closer toward the table, almost tripping on his untied shoelaces.</p>"},{"type":"text","data":"<p>He reluctantly grabbed the watermelon slice.</p>"},{"type":"text","data":"<p>They just stared into each other's eyes as they eat.</p>"},{"type":"text","data":"<p><em>I'm not having fun. Which is fine. I'm not always having fun. But I'm not having fun at my best friend's birthday, which is worse. And I know I'm not having fun at my best friend's birthday, which is even worse than that. And I'm sitting here actively dreading—</em></p>"},{"type":"text","data":"<p>A party blower hit his face about 5 times with a clumsy tempo. It kept playing a <em>'padum :]'</em> sound whenever it was blown onto.</p>"},{"type":"text","data":"<p>More and more people funnelled toward the dining table in a procession with careful steps.</p>"},{"type":"text","data":"<p>Matt had the cake. It was an ice-cream cake with a little too much cream on it and candles that didn't even get Sai's age correct.</p>"},{"type":"text","data":"<p>Both her hands were very committed to the cause. She had her arms flared out, urging no one to come near her.</p>"},{"type":"text","data":"<p>Someone in the back was already going <em>'watch out, watch out, watch out'</em> and right on the third <em>'watch out'</em>, somebody caught Matt's shoulder by just enough.</p>"},{"type":"text","data":"<p><strong>'HAPPY—'</strong></p>"},{"type":"text","data":"<p>The cake kissed the floor.</p>"},{"type":"text","data":"<p>A single, definitive plap rang out.</p>"},{"type":"text","data":"<p>...</p>"},{"type":"text","data":"<p class=\"d\">MATT: \"I told you not to get near—\"</p>"},{"type":"text","data":"<p class=\"d\">MATT: \"Honestly fuck all of you.\"</p>"},{"type":"text","data":"<p>Matt dropped the tray and left for the kitchen.</p>"},{"type":"text","data":"<p>The room went the kind of quiet that was so cringe it was comical. It was more awkward than two people reaching for the same door handle and then doing the little dance. More awkward than small talk. More awkward than sitting in a room together with someone you just argued with.</p>"},{"type":"text","data":"<p>Zhiynl patted Sai on the back.</p>"},{"type":"text","data":"<p class=\"d\">ZHIYNL: \"Happy birthday bro.\"</p>"},{"type":"text","data":"<p>Everyone was just standing there, staring at the dropped cake.</p>"},{"type":"text","data":"<p>Zhiynl cleared his throat for a minute straight. Then kept clearing it. He cleared his throat for what genuinely felt like a full minute, before he glanced around at everyone else in the room.</p>"},{"type":"text","data":"<p>——————————————————————————————</p>"},{"type":"text","data":"<p>Audible gunshots and screams ring out from a house across the street as it went up in flames.</p>"},{"type":"text","data":"<p>No, there were no sirens. It was the sound of people cheering that is conspicuous, some windows breaking here and there too.</p>"},{"type":"text","data":"<p>Andy and Sai sat on a bench that was just left there in the backyard, growing cobwebs and dust. Kj took another bench all to herself, laying right on it.</p>"},{"type":"text","data":"<p>Andy and Sai had cups containing fruit cocktails, and it was mostly silent, relative to everything, until Andy choked and coughed on his drink.</p>"},{"type":"text","data":"<p class=\"d\">ANDY: \"You kinda lied to me\"</p>"},{"type":"text","data":"<p class=\"d\">ANDY: \"No one seemed concerned about me at all.\"</p>"},{"type":"text","data":"<p>Sai looked at his cup.</p>"},{"type":"text","data":"<p class=\"d\">SAI: \"My bad.\"</p>"},{"type":"text","data":"<p class=\"d\">SAI: \"Guess I was the only one that missed you.\"</p>"},{"type":"text","data":"<p>Kj raised up an arm.</p>"},{"type":"text","data":"<p class=\"d\">KJ: \"He didn't miss you\"</p>"},{"type":"text","data":"<p class=\"d\">KJ: \"He called you because this faction is in danger.\"</p>"},{"type":"text","data":"<p class=\"d\">SAI: \"Kj you fucking—\"</p>"},{"type":"text","data":"<p>A very, very loud sound of <em>Clash Royale</em> starting up played from Kj's phone.</p>"},{"type":"text","data":"<p>So they just sat in it for a moment.</p>"},{"type":"text","data":"<p>Sai reached over and took Andy's empty cup, stacking it under his own.</p>"},{"type":"text","data":"<p>From the street perpendicular to their backyard, a car went flying and landed on its roof. They could see and hear it from miles away, didn't exactly startle them.</p>"},{"type":"text","data":"<p class=\"d\">SAI: \"The Underworld is spiralling.\"</p>"},{"type":"text","data":"<p class=\"d\">SAI: \"Everyone in the nation is going to war against each other just for supplies.\"</p>"},{"type":"text","data":"<p class=\"d\">SAI: \"We'd be next before we knew it.\"</p>"},{"type":"text","data":"<p class=\"d\">SAI: \"They'll ambush us... do their best to mutilate, kill, turn us into another LiveLeak video and shit just to get their hands on a day's worth of painkillers.\"</p>"},{"type":"text","data":"<p>Andy tilted his head back and let out a long, irritated breath toward the sky.</p>"},{"type":"text","data":"<p class=\"d\">ANDY: I don't have anything to do with that.\"</p>"},{"type":"text","data":"<p class=\"d\">KJ: \"Andy you're the leader.\"</p>"},{"type":"text","data":"<p>Andy stood up. He stretched, brushed the dust off his clothes, and smiled at both of them in a way that was meant to communicate that he was done with this conversation and wished them both well.</p>"},{"type":"text","data":"<p class=\"d\">KJ: \"Hey, Andy.\"</p>"},{"type":"text","data":"<p>Kj called out to him with her eyes still fixated on her phone.</p>"},{"type":"text","data":"<p class=\"d\">KJ: \"Isn't this your house?\"</p>"},{"type":"text","data":"<p>She held the screen up towards Andy, showing him a photo of a building completely swallowed in flames. A familiar looking building.</p>"},{"type":"text","data":"<p><em>This is...?</em></p>"},{"type":"single-img","url":"image\\02\\4.jpg"},{"type":"paired-double","left":"image\\02\\white.jpg","right":"image\\02\\thanks.jpg"}];
    let PAGINATED_PAGES = [];
    let currentSpread = 0;

    function reflowContent() {
        if (PARSED_ELEMENTS.length === 0) return;

        if (window.innerWidth <= 900 && window.innerHeight > window.innerWidth) {
            PAGINATED_PAGES = [];
            let blockBuffer = "";
            PARSED_ELEMENTS.forEach(el => {
                if (el.type === 'paired-double') {
                    if (blockBuffer !== "") { PAGINATED_PAGES.push({ type: 'text', data: blockBuffer }); blockBuffer = ""; }
                    PAGINATED_PAGES.push({ type: 'single', data: '<img src="' + el.left + '">' });
                    PAGINATED_PAGES.push({ type: 'single', data: '<img src="' + el.right + '">' });
                } else if (el.type === 'single-img') {
                    if (blockBuffer !== "") { PAGINATED_PAGES.push({ type: 'text', data: blockBuffer }); blockBuffer = ""; }
                    PAGINATED_PAGES.push({ type: 'single', data: '<img src="' + el.url + '">' });
                } else {
                    blockBuffer += el.data || el;
                }
            });
            if (blockBuffer !== "") PAGINATED_PAGES.push({ type: 'text', data: blockBuffer });
            currentSpread = 0;
            updateUI();
            return;
        }

        const bookSpread = document.querySelector('.book-spread');
        const spreadWidth = bookSpread.clientWidth;
        if (!spreadWidth || spreadWidth === 0) { requestAnimationFrame(() => reflowContent()); return; }

        const ratio = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--spread-ratio')) || 1.33;
        const spreadHeight = spreadWidth / ratio;
        const targetWidth = (spreadWidth / 2) - 1;
        const pageHeight = spreadHeight - 2;

        const sandbox = document.getElementById('sandbox');
        sandbox.innerHTML = '<article class="page" style="width:' + targetWidth + 'px; height:' + pageHeight + 'px; padding:60px 80px; box-sizing:border-box; overflow:hidden;"><div class="content" id="sand-c" style="width:100%; height:100%; overflow:hidden;"></div></article>';
        const sandC = document.getElementById('sand-c');
        const maxHeight = sandC.offsetHeight;

        if (!maxHeight || maxHeight === 0) {
            sandbox.innerHTML = "";
            requestAnimationFrame(() => reflowContent());
            return;
        }

        PAGINATED_PAGES = [];
        let currentPageBuffer = "";

        function flushTextBuffer() {
            if (currentPageBuffer !== "") {
                PAGINATED_PAGES.push({ type: 'text', data: currentPageBuffer });
                currentPageBuffer = "";
            }
        }

        PARSED_ELEMENTS.forEach(element => {
            if (element.type === 'paired-double') {
                flushTextBuffer();
                if (PAGINATED_PAGES.length % 2 !== 0) PAGINATED_PAGES.push({ type: 'empty', data: "" });
                PAGINATED_PAGES.push({ type: 'single', data: '<img src="' + element.left + '">' });
                PAGINATED_PAGES.push({ type: 'single', data: '<img src="' + element.right + '">' });
                return;
            }
            if (element.type === 'single-img') {
                flushTextBuffer();
                PAGINATED_PAGES.push({ type: 'single', data: '<img src="' + element.url + '">' });
                return;
            }
            let inlineMarkup = element.data;
            sandC.innerHTML = currentPageBuffer + inlineMarkup;
            if (sandC.scrollHeight > maxHeight && currentPageBuffer !== "") {
                PAGINATED_PAGES.push({ type: 'text', data: currentPageBuffer });
                currentPageBuffer = inlineMarkup;
            } else {
                currentPageBuffer += inlineMarkup;
            }
        });

        flushTextBuffer();
        sandbox.innerHTML = "";
        currentSpread = 0;
        updateUI();
    }

    function updateUI() {
        const container = document.getElementById('spread-content-area');
        container.innerHTML = "";
        if (PAGINATED_PAGES.length === 0) return;
        const isMobileView = window.innerWidth <= 900 && window.innerHeight > window.innerWidth;
        const bookSpreadElement = document.getElementById('spreadElement');
        if (isMobileView) {
            bookSpreadElement.style.display = "block"; bookSpreadElement.style.border = "none";
            const currentItem = PAGINATED_PAGES[currentSpread]; if (!currentItem) return;
            if (currentItem.type === 'single') { container.innerHTML = '<article class="page no-padding">' + currentItem.data + '</article>'; }
            else { container.innerHTML = '<article class="page"><div class="content">' + currentItem.data + '</div></article>'; }
            handleSpoilerState(container); return;
        }
        bookSpreadElement.style.display = "grid"; bookSpreadElement.style.border = "1px solid var(--border-light)";
        const leftIndex = currentSpread * 2; const rightIndex = leftIndex + 1;
        const leftPageData = PAGINATED_PAGES[leftIndex]; const rightPageData = PAGINATED_PAGES[rightIndex];
        let leftHtml = "";
        if (leftPageData) {
            if (leftPageData.type === 'single') leftHtml = '<article class="page no-padding" id="L-PAGE">' + leftPageData.data + '</article>';
            else if (leftPageData.type === 'text') leftHtml = '<article class="page" id="L-PAGE"><div class="content">' + leftPageData.data + '</div></article>';
            else leftHtml = '<article class="page" id="L-PAGE"></article>';
        } else { leftHtml = '<article class="page" id="L-PAGE"></article>'; }
        let rightHtml = "";
        if (rightPageData) {
            if (rightPageData.type === 'single') rightHtml = '<article class="page no-padding" id="R-PAGE">' + rightPageData.data + '</article>';
            else if (rightPageData.type === 'text') rightHtml = '<article class="page" id="R-PAGE"><div class="content">' + rightPageData.data + '</div></article>';
            else rightHtml = '<article class="page" id="R-PAGE"></article>';
        } else { rightHtml = '<article class="page" id="R-PAGE" style="display:none;"></article>'; }
        container.innerHTML = leftHtml + rightHtml;
        handleSpoilerState(container);
    }

    function handleSpoilerState(container) {
        const isSpoilerOn = localStorage.getItem('spoiler-mode') === 'true';
        const pages = container.querySelectorAll('.page');
        pages.forEach(page => {
            if (isSpoilerOn && page.classList.contains('no-padding')) {
                page.classList.add('spoiler-active');
                page.onclick = (e) => { if (page.classList.contains('spoiler-active') && !page.classList.contains('revealed')) { e.stopPropagation(); page.classList.add('revealed'); } };
            }
        });
    }

    function nextPage() {
        const isMobileView = window.innerWidth <= 900 && window.innerHeight > window.innerWidth;
        const activeSpoiler = document.querySelector('.spoiler-active:not(.revealed)');
        if (activeSpoiler) { activeSpoiler.classList.add('revealed'); return; }
        if (isMobileView) { if (currentSpread + 1 < PAGINATED_PAGES.length) { currentSpread++; updateUI(); window.scrollTo({ top: 0 }); } }
        else { if ((currentSpread + 1) * 2 < PAGINATED_PAGES.length) { currentSpread++; updateUI(); window.scrollTo({ top: 0 }); } }
    }

    function prevPage() { if (currentSpread > 0) { currentSpread--; updateUI(); window.scrollTo({ top: 0 }); } }

    function updateRatio(val) {
        if (val !== "1.33" && val !== "1.5" && val !== "1.25") val = "1.33";
        document.documentElement.style.setProperty('--spread-ratio', val);
        document.body.setAttribute('data-ratio', val);
        localStorage.setItem('individuals-ratio', val);
        setTimeout(() => reflowContent(), 100);
    }

    window.addEventListener('resize', () => setTimeout(() => reflowContent(), 100));

    window.onload = () => {
        if (localStorage.getItem('site-theme') === 'light') document.body.classList.add('light-theme');
        let saved = localStorage.getItem('individuals-ratio') || "1.33";
        if (saved !== "1.33" && saved !== "1.5" && saved !== "1.25") saved = "1.33";
        document.getElementById('ratioSelect').value = saved;
        updateRatio(saved);
    };</script>
</body>
</html>
