    <style>
        :root { --bg: #0e0e0e; --page-bg: #151515; --white-raw: 255, 255, 255; --spread-ratio: 1.33; --panel-bg: rgba(20, 20, 20, 0.95); --border-color: #333; --border-light: #222; --input-bg: #000; --text-main: #fff; }
        body.light-theme { --bg: #e5e5e5; --page-bg: #ffffff; --white-raw: 0, 0, 0; --panel-bg: rgba(255, 255, 255, 0.95); --border-color: #ccc; --border-light: #ddd; --input-bg: #fff; --text-main: #000; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg); margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; color: var(--text-main); }
        .book-container { width: 95%; max-width: 1400px; margin: 20px 0; }
        .book-spread { display: grid; grid-template-columns: 1fr 1fr; width: 100%; aspect-ratio: var(--spread-ratio); background: var(--page-bg); border: 1px solid var(--border-light); position: relative; overflow: hidden; }
        .book-spread::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: var(--border-light); z-index: 5; }
        .page { position: relative; display: flex; flex-direction: column; height: 100%; padding: 60px 80px; box-sizing: border-box; overflow: hidden; }
        @media (max-width: 900px) {

            .book-spread::before { display: none; }
            .page { padding: 40px 25px; height: auto; min-height: 400px; border-bottom: 1px solid var(--border-light); }
            .settings-panel { left: 0 !important; right: 0 !important; bottom: 0 !important; flex-direction: row !important; justify-content: space-between; width: 100%; border-left: none; border-right: none; padding: 15px 20px !important; box-sizing: border-box; }
            .footer-nav { margin-bottom: 100px; }
        }
        @media (max-width: 900px) and (orientation: landscape) {
            .book-spread { grid-template-columns: 1fr 1fr; aspect-ratio: var(--spread-ratio) !important; overflow: hidden; }
            .book-spread::before { display: block; } .page { padding: 30px; }
        }
        .content { width: 100%; height: 100%; overflow: hidden; }
        .content p { font-size: 1.1rem; line-height: 1.7; margin-bottom: 20px; color: rgba(var(--white-raw), 0.8); }
        .d { display: flex !important; background: rgba(var(--white-raw), 0.05); padding: 12px; border-radius: 4px; margin-bottom: 20px; font-weight: 500; }
        .d::before { content: ""; min-width: 4px; height: 1.2rem; background: rgba(var(--white-raw), 0.4); margin-right: 12px; }
        .no-padding { padding: 0 !important; }
        .no-padding img { width: 100%; height: 100%; display: block; object-fit: cover; }
        .settings-panel { position: fixed; bottom: 20px; right: 20px; z-index: 100; background: var(--panel-bg); backdrop-filter: blur(8px); padding: 12px; border: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 8px; font-size: 10px; text-transform: uppercase; letter-spacing: 1px; }
        select { background: var(--input-bg); color: var(--text-main); border: 1px solid var(--border-color); padding: 8px; cursor: pointer; outline: none; }
        .nav-zone { position: absolute; top: 0; bottom: 0; width: 40%; z-index: 10; cursor: pointer; }
        .left-zone { left: 0; } .right-zone { right: 0; }
        .footer-nav { margin: 20px 0 60px 0; z-index: 10; }
        .return-btn { text-decoration: none; color: rgba(var(--white-raw), 0.5); font-size: 12px; letter-spacing: 2px; padding: 12px 25px; border: 1px solid var(--border-color); transition: 0.3s; }
        .return-btn:hover { background: var(--text-main); color: var(--bg); }
        .spoiler-active img { filter: blur(60px) grayscale(1); transition: 0.3s; }
        .revealed img { filter: blur(0) grayscale(0) !important; }
        .spoiler-active:not(.revealed)::after { content: "SPOILER: CLICK TO REVEAL"; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.9); color: white; padding: 12px 20px; font-size: 11px; letter-spacing: 2px; z-index: 20; pointer-events: none; border: 1px solid #555; }
        #sandbox { position: fixed; visibility: hidden; top: -9999px; left: -9999px; overflow: hidden; }

<script>
    const PARSED_ELEMENTS = [{"type":"text","data":"<p>Sai had his gun locked onto Miguel.</p>"},{"type":"text","data":"<p><em>O.S.I.R.I.S... I’ve heard of them somewhere.</em></p>"},{"type":"text","data":"<p class=\"d\">MIGUEL: \"Now, you see...\"</p>"},{"type":"text","data":"<p class=\"d\">MIGUEL: \"What we're going to do is—\"</p>"},{"type":"text","data":"<p><strong>BANG</strong></p>"},{"type":"text","data":"<p>The bullet went flying through the crammed distance of the car’s cabin, only to land on seemingly no one. One of the duffel bags was smoking after being shot.</p>"},{"type":"text","data":"<p>Sai’s target appeared at the driver’s door.</p>"},{"type":"text","data":"<p>He tapped on Sai’s shoulder, forcing an instinctive reaction out of Sai, who turned around and pulled the trigger yet again. With the same result, Miguel materialized right next to Sai, sitting in the passenger seat with both his feet resting on the dashboard.</p>"},{"type":"text","data":"<p class=\"d\">MIGUEL: “Listen, buddy.”</p>"},{"type":"text","data":"<p class=\"d\">MIGUEL: “I'd like to interrogate you and your dangerous best friend for your crazy stunt today.”</p>"},{"type":"text","data":"<p class=\"d\">MIGUEL: “It's our policy to keep overworlders outside of this dirty work, after all.”</p>"},{"type":"text","data":"<p>Yet again, Sai pointed the gun to where Miguel was and opened fire.</p>"},{"type":"text","data":"<p>Miguel teleported back outside the car by the door, only for Sai to kick the door open, forcing Miguel to leap back. Sai attempted to follow up by lunging toward him, taking a stance to whip his pistol against Miguel’s chin, but Miguel simply teleported behind him for a strike.</p>"},{"type":"text","data":"<p>Sai stopped the chop with his pistol, Miguel’s bare hand clashing with the cold steel of the Desert Eagle. For a moment, they were locked in a stalemate.</p>"},{"type":"text","data":"<p><em>I was expecting the pistol to break...</em></p>"},{"type":"text","data":"<p><em>So he isn’t that much of a physical powerhouse, huh?</em></p>"},{"type":"text","data":"<p>A sweep came by, knocking Miguel down. Sai immediately aimed his gun at the falling man, only for his bullet to meet the hard asphalt ground. He felt his head being grabbed from behind.</p>"},{"type":"text","data":"<p>A painful sensation flared as his nose broke against a nearby fire hydrant. It was crazy, for they were just in the middle of the road half a second ago.</p>"},{"type":"text","data":"<p>And the next second, they were in the middle of an alleyway, not that far away from their cars, but definitely not a distance you'd reach within the blink of an eye.</p>"},{"type":"text","data":"<p>Simple, though it never fails to be disorienting.</p>"},{"type":"text","data":"<p>Miguel coughed, one hand covering his mouth and the other grabbing Sai by the suit's collar.</p>"},{"type":"text","data":"<p>He took a few steps forward before tossing Sai onto the floor, causing him to tumble down like a discarded tool.</p>"},{"type":"text","data":"<p><em>This alley is cramped. It's straight-up bad news!</em></p>"},{"type":"text","data":"<p><em>I have to— </em></p>"},{"type":"text","data":"<p>The moment Sai stood up, he was met with a steadfast barrage of strikes from every direction he could perceive.</p>"},{"type":"single-img","url":"image\\04/1.jpg"},{"type":"text","data":"<p>As hard as it was to catch up, he finally predicted Miguel’s next move and clutched his wrist mid-teleport before winding up what looked to be a very powerful punch.</p>"},{"type":"text","data":"<p>Unfortunately, Miguel teleported far away, breaking apart the attack completely. He scratched his head.</p>"},{"type":"text","data":"<p class=\"d\">MIGUEL: \"You're not gonna comply?\"</p>"},{"type":"text","data":"<p>Sai was huffing, watching Miguel with a wary expression. He slowly drew his pistol, fingers resting lightly on the trigger, ready to whip it out and land a proper shot the moment he had an opening.</p>"},{"type":"text","data":"<p>The idea of not being able to land his punches annoyed him to some extent.</p>"},{"type":"text","data":"<p class=\"d\">MIGUEL: \"Everyone likes the idea of a 'paradise'.\"</p>"},{"type":"text","data":"<p class=\"d\">MIGUEL: \"Just listen to me once, would you? We could work out a deal.\"</p>"},{"type":"text","data":"<p class=\"d\">SAI: \"After you beat me senseless? No way.\"</p>"},{"type":"text","data":"<p class=\"d\">SAI: \"Besides, I don't trust bureaucratic organizations... like yours.\"</p>"},{"type":"text","data":"<p class=\"d\">SAI: \"If you wanna 'talk' that bad, come over here and snap all my fucking bones in half.\"</p>"},{"type":"text","data":"<p>Miguel took a step forward, vanished, and reappeared right in front of Sai. Alert, Sai raised his gun straight to Miguel's chin and pulled the trigger. The shot went flying into the air.</p>"},{"type":"text","data":"<p><em>Tch!</em></p>"},{"type":"text","data":"<p>He manifested from behind. Sai spun on his heel. But Miguel teleported again, reappearing behind Sai where he had originally been facing.</p>"},{"type":"text","data":"<p>Sai feinted the turn and followed through with a pistol whip, knocking blood from Miguel's nose. He fired off a few shots. Miguel leapt back, teleported onto the wall next to Sai with his feet planted flat against it like he was coiled to spring, then launched himself straight at Sai.</p>"},{"type":"text","data":"<p>The lunge sent both fighters crashing into a nearby pile of garbage. Miguel drove a few punches into Sai's face. Sai caught the next one and countered by snatching a jagged shard of a wine glass, shattered in half from the pile, slamming it straight into Miguel's mouth and sending him reeling back.</p>"},{"type":"text","data":"<p>Sai broke into a run whilst Miguel was busy nursing his face and processing the pain, maybe being a bitch about it too. He glanced up at his retreating opponent, slowly losing his patience having to deal with this persistent summer ant.</p>"},{"type":"paired-double","left":"image\\04\\2.jpg","right":"image\\04\\3.jpg"},{"type":"text","data":"<p>It took just a few seconds for Sai to realize that trying to run away from a teleporter was an absolutely horrible idea. As a means of adding insult to injury, Miguel blinked all over the cramped alleyway, appearing as if he were stalling despite chasing down Sai.</p>"},{"type":"text","data":"<p>Miguel yanked Sai by the hair from behind and pulled, he disappeared from where he was and went in front of Sai’s vision, kicking him square in the face. Sai dropped flat on the ground, blood trickling down from his lips, the accumulation of hits he had taken surely took a toll on him.</p>"},{"type":"text","data":"<p>Miguel smoothly drew a knife and twirled it between his fingers, approaching him with a lowered, cautious stance.</p>"},{"type":"text","data":"<p class=\"d\">MIGUEL: \"I won't necessarily break your bones. But I'll make sure you wish that's the route I'd gone with instead.\"</p>"},{"type":"text","data":"<p>Miguel stopped short of Sai and wiped his forehead with the back of his hand, eyes narrowing with contempt as he looked down at his target.</p>"},{"type":"text","data":"<p class=\"d\">MIGUEL: \"You're making this hard for both of us, and I won't lie, I'm pretty fucking pissed.\"</p>"},{"type":"text","data":"<p class=\"d\">MIGUEL: \"You, your leader, and your childish fantasy of a 'faction' are hopeless. A straight road to damnation for this corrupt world.\"</p>"},{"type":"text","data":"<p class=\"d\">MIGUEL: \"Especially that poor excuse of the man you call your leader... a delusional retard who truly believes he can exist in both worlds. Slapping his own dick thinking he can live a normal life after all the shit he's done.\"</p>"},{"type":"text","data":"<p>Sai's expression darkened. Miguel charged at him and Sai threw his arms up, but it was futile against the blade. It pierced clean through his forearm and in one sharp upward motion, split his hand vertically up the middle. Sai let out a short, pained sound.</p>"},{"type":"text","data":"<p>The blade drove into his neck, forcing a mouthful of crimson out of him. His entire body rattled from the force of it.</p>"},{"type":"text","data":"<p>Still, he gripped Miguel by the elbows with his uncut hand and spoke, even with raspy, unpleasant sounds that followed his words.</p>"},{"type":"text","data":"<p class=\"d\">SAI: “I believe people should be able to live in the present without being weighed down by the monstrosities of their past.”</p>"},{"type":"text","data":"<p class=\"d\">SAI: “They get tortured, no one bats an eye. Though when they simply try to make some quick bucks, death penalty for them.”</p>"},{"type":"text","data":"<p class=\"d\">SAI: “...The game changes whenever it is convenient.”</p>"},{"type":"text","data":"<p>He gritted his teeth. His free, injured arm slowly slid into his pocket.</p>"},{"type":"text","data":"<p class=\"d\">SAI: “Hence, if I secure a tomorrow where everyone can stay comfortable without having to think about today or yesterday, it'll all be fine.”</p>"},{"type":"text","data":"<p class=\"d\">SAI: “The rest of the world can rot into hell for all I care. As long as my house stays clean, I don't give a flying shit about who gets buried outside.”</p>"},{"type":"text","data":"<p>Miguel was unsatisfied. He wrenched the knife free and drove it back into Sai's neck, this time closer to his chin, forcing a wet, gargling cough out of him, even his parted lips were shaking.</p>"},{"type":"text","data":"<p class=\"d\">MIGUEL: “That's a noble way of saying you're selfish.”</p>"},{"type":"text","data":"<p class=\"d\">MIGUEL: \"You're implying that if anyone of you were to rape somebody, kill a child, murder a family, you'd congratulate them? Do you hear yourself? You want them to live without any consequences?\"</p>"},{"type":"text","data":"<p>Sai chuckled. He kept his eyes fixed on Miguel, actually pulling him closer to his own face.</p>"},{"type":"text","data":"<p class=\"d\">SAI: “I want them to be treated fairly.”</p>"},{"type":"text","data":"<p class=\"d\">SAI: “And I'm confident in my beliefs because they're good people just trying to live.”</p>"},{"type":"text","data":"<p class=\"d\">SAI: “Though... it's not like that matters in the slightest.”</p>"},{"type":"text","data":"<p>The knife lodged in Sai's throat had gone brittle and rusted over, old and crumbling. It snapped clean from a single shift of his neck, so brittle that it feels like the knife itself hasn’t been utilized for decades.</p>"},{"type":"text","data":"<p><strong><em>\"Where Tomorrow Dies.\"</em></strong></p>"},{"type":"text","data":"<p>He pulled his arm free from his pocket and aimed his trusted gun toward Miguel point blank.</p>"},{"type":"text","data":"<p><em>His arm. I know I sliced it clean in half!!</em></p>"},{"type":"text","data":"<p><strong>BANG.</strong></p>"},{"type":"text","data":"<p>A smoking hole tore open in Miguel's chest and another punched through his collarbone. He stumbled backward, legs unsteady beneath him, until his back met a wall fitted with a metal ladder and a balcony structure overhead.</p>"},{"type":"text","data":"<p>Sai tossed his gun aside.</p>"},{"type":"text","data":"<p>The balcony and the tangle of stairs looming above Miguel began rattling violently, the whole structure groaning under some kind of force. Then in an instant, it all gave way, dissolving into raw material. Beams, rebar, and lead came crashing down, burying Miguel completely beneath their weight.</p>"},{"type":"text","data":"<p>Underneath the graveyard of steel, Miguel gripped his hands tight. Maybe his gut was right when it came to disposing this troublemaking faction, negotiations shouldn’t even be an option in the first place.</p>"},{"type":"text","data":"<p>Miguel pushed himself up from the rubble, flailing slightly from the pain.</p>"},{"type":"text","data":"<p><strong>SHMACK</strong></p>"},{"type":"text","data":"<p>Sai didn't let him breathe. He came down on him with a cluster of punches, cycling through the neck, chin, chest, face, diaphragm, liver and gut, dedicating at least one or two hits to each spot like he was working through a checklist.</p>"},{"type":"text","data":"<p>Miguel shot his palms up to stop it. Sai tackled into him anyway, the two of them crashing through the wall behind Miguel. The concrete was already brittle and crumbling from the reach of Sai’s Oddity. They tumbled through to the other side and landed inside a hardware store, shelves, heavy display items above them, shit, there’s even a small tractor sitting in the middle of the store.</p>"},{"type":"text","data":"<p>Sai tossed Miguel forward as they hit the ground, sending him skidding into an aisle stocked with screwdriver packets, whilst Sai himself was given a wide option of carpentry tools he could work with in the aisle he ended up in.</p>"},{"type":"text","data":"<p>He saw Miguel's figure walking from the opposing aisle in front of him before vanishing. Sai crouched down and picked up the sharpest claw hammer he could find, tearing the packaging open with his teeth and discarding it on the ground.</p>"},{"type":"text","data":"<p>Giving it a quick test, Sai slammed it against the floor, a move that was quite possibly a dead giveaway to his location.</p>"},{"type":"text","data":"<p>He stood up and carefully walked around the store, keeping an eye for his opponent, planning his next move even.</p>"},{"type":"text","data":"<p>The display tractor in the middle of the store roared to life at the exact second one of the white racks obstructed his vision. He felt someone breathing down behind him.</p>"},{"type":"text","data":"<p>Sai ducked low just as Miguel swung a raw block of wood. Though the five-meter length of timber made it hard to control the heavy follow-up movement, the only thing he hit was more appliances on the racks behind Sai.</p>"},{"type":"text","data":"<p>This left an opening for Sai, who wasted no time slamming the hammer straight into Miguel's forearm. He then swung it directly into his mouth, the sharp claw catching the roof of Miguel's mouth as he pressed him against a wall to dig the tool in deeper.</p>"},{"type":"text","data":"<p>With his chin forcibly tilted up, the top of Miguel's head was already being pressed to the side of a drill hanging on the shelf, so he snatched one of the loose drill bits and tossed it at Sai.</p>"},{"type":"text","data":"<p>Sai dodged the projectile, but Miguel sent his knee straight toward Sai's gut, launching him hard across the floor near the tractor. Miguel jumped toward Sai with a screwdriver, bringing it down to pin Sai's arm to the ground. Shouting in agony, Sai swung the hammer and cracked a portion of Miguel's skull.</p>"},{"type":"text","data":"<p>Miguel teleported away, catching a break to tend to his fixable wounds.</p>"},{"type":"text","data":"<p>Sai retreated too, disappearing from sight. Audible splashes were heard shortly after, followed by a bit of cluttering noise. After a short while, he returned with an airhorn, blasting it to alert his opponent, perhaps even to taunt him.</p>"},{"type":"text","data":"<p>Miguel emerged in front of him mid-air, his knee already shot outward. Sai attempted to block, but the strike crashed onto his face anyway, shattering his glasses and breaking his nose yet again. Miguel then appeared behind Sai, catching him by his back before he could fall, and tossed him right in front of the live tractor.</p>"},{"type":"text","data":"<p>Miguel appeared inside the driver's seat of the tractor now, both hands resting atop the steering wheel. The vehicle snapped loose from its weak restraints and turned slightly, charging straight at Sai.</p>"},{"type":"text","data":"<p>Sai hopped onto one of the display shelves, causing it to tumble over. He leapt to another, and it tumbled too. He kept hopping across the shelves like a parkour YouTuber filming a first-person vlog of a police chase.</p>"},{"type":"text","data":"<p>Upon hovering over a shelf containing boxes of matches, Sai snatched one and hopped onto the hood of the tractor. He slammed his palm against the windshield, instantly turning the glass into silica sand.</p>"},{"type":"text","data":"<p>Miguel took notice of this and immediately teleported away, leaving the tractor to plow through aisles upon aisles before finally stopping as it slammed into the wall on the far end of the store.</p>"},{"type":"text","data":"<p>Miguel picked up a metal plumbing pipe from the floor, which had definitely ended up there from all the destruction the tractor caused.</p>"},{"type":"text","data":"<p>He moved around the store to look for Sai, even teleporting over the ruined spaces, but found no traces of him at all.</p>"},{"type":"text","data":"<p><em>Pppsssssssssssttttttttttttttttttttttttt..... </em></p>"},{"type":"text","data":"<p>It sounded like a gas leak. The smell was getting pretty strong too, though he could not truly pinpoint where the sound was coming from. Looking around, he searched for the source, for Sai, and for whatever was causing the leak.</p>"},{"type":"text","data":"<p>There was gasoline on the floor and a bunch of propane tanks were turned on, but neither truly seemed like the prominent cause of the sound and smell. There was also liquid spilling from the aisles, almost mixing with the gasoline, alongside a bunch of scattered bottles labeled 'Acetone' and 'Lacquer.'</p>"},{"type":"text","data":"<p><em>And... a hand? It was sticking out of the rubble!</em></p>"},{"type":"text","data":"<p>The exact source of this odd sound and smell was no coincidence. He saw a full arm and hand popping out of the debris underneath the tractor and the stacked, drenched aisles. It was spraying a WD-40 can into the air. A second later, another arm popped out of the rubble, holding a lit match.</p>"},{"type":"text","data":"<p><strong><em>KABOOOOMMMMMMMMMMMMM</em></strong></p>"},{"type":"text","data":"<p>Cascaded and layered atop each other, a single short fire blast from the WD-40 spray was enough to trigger the next flammable item, then the next, and so on, until the entire store exploded, engulfing the space in flames.</p>"},{"type":"text","data":"<p>Sai crawled out of the store, his body bloodied, bruised, ridden with burn scars that no ordinary human could’ve possibly endured. He clutched his elbow, trying to recover.</p>"},{"type":"text","data":"<p>Suddenly, a heavy kick from the side sent him flying right into the open road. Miguel had foreseen the trap beforehand and had simply acted clueless, teleporting out the exact moment the store blew up.</p>"},{"type":"text","data":"<p>He had just been waiting for Sai to walk out.</p>"},{"type":"text","data":"<p>Before Sai could even stand up, a car struck him, sending him airborne. His body rolled across the hood until it smacked heavily into the windshield. The driver shrieked, flooring the gas pedal instead of the brake in a panicked, desperate attempt to shake him off.</p>"},{"type":"text","data":"<p>Miguel appeared on the roof of the car, crowbar in hand, he'd grabbed it on the way out of the store. He looked down at Sai for a moment, then teleported inside to the passenger seat, seized the steering wheel and wrenched it hard to the right.</p>"},{"type":"text","data":"<p>The car veered off course and ploughed straight into a restricted construction site.</p>"},{"type":"text","data":"<p><strong>CRASHHH</strong></p>"},{"type":"text","data":"<p>Miguel stepped out from the dust and settling smoke, standing unfazed beneath the scaffolding of an unfinished building looming overhead. He watched as the wreckage cleared.</p>"},{"type":"text","data":"<p>Sai climbed out from the other side, unhurt. The blood on his clothes had simply faded away. Bruises cleared. He pushed his glasses back up his nose bridge and looked no different from how he did before the fight started, as if nothing had happened at all.</p>"},{"type":"text","data":"<p class=\"d\">SAI: “You're not that good of a person either, huh.”</p>"},{"type":"text","data":"<p class=\"d\">SAI: “The driver's corpse is under the car. Nice one.”</p>"},{"type":"text","data":"<p>Miguel didn't answer.</p>"},{"type":"text","data":"<p>Sai smiled. He pointed toward the ground beneath Miguel's feet. Miguel looked at Sai, then down at the ground, then back to Sai, then to the ground again.</p>"},{"type":"text","data":"<p>It was no longer concrete. It was softening, breaking down, reverting back to the wet, unset state it had been before it ever hardened. A slow liquid pour spreading out beneath him, only to harden into its previous form when it caught his legs.</p>"},{"type":"text","data":"<p>Miguel's eyes widened as Sai walked toward him without hurrying.</p>"},{"type":"text","data":"<p>He threw in a haymaker, a clean gut punch that made Miguel gag and lose his grip on the crowbar.</p>"},{"type":"text","data":"<p>Sai caught it before it hit the ground. He looked it over, then looked back up at Miguel with an amused expression, eyebrows raised.</p>"},{"type":"single-img","url":"image/04/4.jpg"},{"type":"text","data":"<p><strong><em> SMACK. SMACK. SMACK. SMACK. SMACK. SMACK. </em></strong></p>"},{"type":"text","data":"<p><strong><em> SMACK. SMACK. SMACK. SMACK. SMACK. SMACK. </em></strong></p>"},{"type":"text","data":"<p><strong><em> SMACK. SMACK. SMACK. SMACK. SMACK. SMACK. </em></strong></p>"},{"type":"text","data":"<p>The final clamorous strike caused Miguel to reel his head back, unable to move due to his hardened and restrained form.</p>"},{"type":"text","data":"<p>A crew of construction workers went ahead and checked the commotion, as if the car crash from earlier hadn't already attracted the attention of those nearby.</p>"},{"type":"text","data":"<p>Miguel took a moment, taking deep breaths and attempting to stay awake.</p>"},{"type":"text","data":"<p class=\"d\">SAI: \"You're resilient.\"</p>"},{"type":"text","data":"<p class=\"d\">MIGUEL: \"My purpose...\"</p>"},{"type":"text","data":"<p class=\"d\">MIGUEL: \"You and I are merely two desperate people shooting their organs out in hopes that our trivial end goal falls into our palms...\"</p>"},{"type":"text","data":"<p class=\"d\">SAI: \"...\"</p>"},{"type":"text","data":"<p class=\"d\">MIGUEL: \"Honestly, I don't care about who's right or wrong, either... I'm just fulfilling my duty.\"</p>"},{"type":"text","data":"<p>Sai raised an eyebrow. He took a step back and wiped the blood off the crowbar using his thumb.</p>"},{"type":"text","data":"<p class=\"d\">SAI: \"What happened to delivering justice? About us being a threat in a macro scope?\"</p>"},{"type":"text","data":"<p>Miguel gritted his teeth.</p>"},{"type":"text","data":"<p>Everyone around them stared in shock as both of them disappeared into thin air. Little did they realize, above them, two people hovered in the air. Miguel clutched Sai by the hair and sent him dropping down, freefalling.</p>"},{"type":"text","data":"<p>Amidst the freefall, he teleported slightly lower and kicked Sai into a construction building, letting him crash through fragile walls, rebar, construction equipment, and scaffolding.</p>"},{"type":"paired-double","left":"image\\04\\5.jpg","right":"image\\04\\6.jpg"},{"type":"text","data":"<p class=\"d\">MIGUEL: \"The moment we were sent here, we were officially 'useless' and 'unwanted!'\"</p>"},{"type":"text","data":"<p>Sai skidded on the ground after that powerful blow. He spun his crowbar once and charged forward, his crowbar clashing against Miguel’s raw fist.</p>"},{"type":"text","data":"<p class=\"d\">MIGUEL: \"I was an empty vessel, walking without a purpose.\"</p>"},{"type":"text","data":"<p class=\"d\">MIGUEL: \"This very 'duty' and responsibility I hold within O.S.I.R.I.S. gave me what I lacked. It is ultimately a way for me to run away from this world.\"</p>"},{"type":"text","data":"<p>He held out another arm and grabbed it by the other end of Sai’s crowbar.</p>"},{"type":"text","data":"<p class=\"d\">MIGUEL: \"'I lived my life doing the right thing sounds better than I lived my life being useless and discarded.\"</p>"},{"type":"text","data":"<p>Encrusted concrete that restricted Miguel's movement began cracking, smoke billowing off as chunks of it flew.</p>"},{"type":"text","data":"<p class=\"d\">SAI: \"That's fucking miserable!\"</p>"},{"type":"text","data":"<p>Miguel ducked low and slammed against Sai with his elbow. The impact was strong enough that Sai's colliding body ruined one of the major support beams, causing the unfinished building to tilt slightly. Miguel teleported in front, and their strikes clashed, metal sounds echoing against his fist.</p>"},{"type":"text","data":"<p>He manifested on top of Sai and dived straight onto him, causing them to fall through several stories. The top half of the building fell down completely, ruining years of work. They ultimately ended up in a dark basement among the chunks of the building that were still intact.</p>"},{"type":"text","data":"<p>It was dark; he couldn't see anyone or anything here. Sai fumbled through his pockets and ignited three matches. He rapidly turned his head, glancing all around the dimly lit area for where Miguel was.</p>"},{"type":"text","data":"<p>From one of the directions, Miguel lunged, puncturing through his nose with a glass shard. Sai tumbled over and collapsed.</p>"},{"type":"text","data":"<p class=\"d\">MIGUEL: \"Your entropic manipulation...\"</p>"},{"type":"text","data":"<p class=\"d\">MIGUEL: \"If I go straight for your head, you won't be able to rewind your injuries.\"</p>"},{"type":"text","data":"<p>Sai choked disgustedly. The matchbox broke open, letting the sticks scatter on the ground right next to him. He flipped his body to reach for the matches, hurriedly lighting them up as he let out agonizing sounds of pain.</p>"},{"type":"text","data":"<p>Miguel pulled his arm back and drove the shard down.</p>"},{"type":"text","data":"<p>A cloud of dust intercepted the strike, some even catching in Miguel's eyes. Whatever Sai managed to do with some of the burning matches that had withered into dust pellets, he used it as a pitiful distraction.</p>"},{"type":"text","data":"<p>Or so it seemed.</p>"},{"type":"text","data":"<p>The next second, Miguel's entire body lit up in flames.</p>"},{"type":"text","data":"<p class=\"d\">MIGUEL: \"What the fuck!?\"</p>"},{"type":"text","data":"<p class=\"d\">MIGUEL: \"What the hell did you do!??\"</p>"},{"type":"text","data":"<p>He flicked his arms and patted at the fire engulfing him to try and put it out, frantically moving around where he could. However, even his movement was cut short; his legs completely stopped functioning as the flash-heat triggered a thermal expansion effect of some kind within the cured concrete, fusing the stone with his legs due to the intense heat.</p>"},{"type":"text","data":"<p class=\"d\">SAI: \"Pure phosphorus is volatile.\"</p>"},{"type":"text","data":"<p><em>Where Tomorrow Dies</em> consists of entropic manipulation, mimicking that of time manipulation in a more localized manner.</p>"},{"type":"text","data":"<p>Crumbs of the used matchsticks were gathered by him as a last-resort move and were rewound into their pure chemical state the moment they made contact with Miguel.</p>"},{"type":"text","data":"<p>Sai stood up, his injuries rewound. He grabbed the glass shard on the floor containing his own blood.</p>"},{"type":"text","data":"<p class=\"d\">SAI: “You should be happy.”</p>"},{"type":"text","data":"<p class=\"d\">SAI: \"You died for your purpose.\"</p>"},{"type":"text","data":"<p><strong>SLAM</strong></p>"},{"type":"single-img","url":"image\\04\\end.jpg"}];
    let PAGINATED_PAGES = [];
    let currentSpread = 0;

    function reflowContent() {
        if (PARSED_ELEMENTS.length === 0) return;

        if (window.innerWidth <= 900 && window.innerHeight > window.innerWidth) {
            PAGINATED_PAGES = [];
            let blockBuffer = "";
            PARSED_ELEMENTS.forEach(el => {
                if (el.type === 'paired-double') {
                    if (blockBuffer !== "") { PAGINATED_PAGES.push({ type: 'text', data: blockBuffer }); blockBuffer = ""; }
                    PAGINATED_PAGES.push({ type: 'single', data: '<img src="' + el.left + '">' });
                    PAGINATED_PAGES.push({ type: 'single', data: '<img src="' + el.right + '">' });
                } else if (el.type === 'single-img') {
                    if (blockBuffer !== "") { PAGINATED_PAGES.push({ type: 'text', data: blockBuffer }); blockBuffer = ""; }
                    PAGINATED_PAGES.push({ type: 'single', data: '<img src="' + el.url + '">' });
                } else {
                    blockBuffer += el.data || el;
                }
            });
            if (blockBuffer !== "") PAGINATED_PAGES.push({ type: 'text', data: blockBuffer });
            currentSpread = 0;
            updateUI();
            return;
        }

        const bookSpread = document.querySelector('.book-spread');
        const spreadWidth = bookSpread.clientWidth;
        if (!spreadWidth || spreadWidth === 0) { requestAnimationFrame(() => reflowContent()); return; }

        const ratio = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--spread-ratio')) || 1.33;
        const spreadHeight = spreadWidth / ratio;
        const targetWidth = (spreadWidth / 2) - 1;
        const pageHeight = spreadHeight - 2;

        const sandbox = document.getElementById('sandbox');
        sandbox.innerHTML = '<article class="page" style="width:' + targetWidth + 'px; height:' + pageHeight + 'px; padding:60px 80px; box-sizing:border-box; overflow:hidden;"><div class="content" id="sand-c" style="width:100%; height:100%; overflow:hidden;"></div></article>';
        const sandC = document.getElementById('sand-c');
        const maxHeight = sandC.offsetHeight;

        if (!maxHeight || maxHeight === 0) {
            sandbox.innerHTML = "";
            requestAnimationFrame(() => reflowContent());
            return;
        }

        PAGINATED_PAGES = [];
        let currentPageBuffer = "";

        function flushTextBuffer() {
            if (currentPageBuffer !== "") {
                PAGINATED_PAGES.push({ type: 'text', data: currentPageBuffer });
                currentPageBuffer = "";
            }
        }

        PARSED_ELEMENTS.forEach(element => {
            if (element.type === 'paired-double') {
                flushTextBuffer();
                if (PAGINATED_PAGES.length % 2 !== 0) PAGINATED_PAGES.push({ type: 'empty', data: "" });
                PAGINATED_PAGES.push({ type: 'single', data: '<img src="' + element.left + '">' });
                PAGINATED_PAGES.push({ type: 'single', data: '<img src="' + element.right + '">' });
                return;
            }
            if (element.type === 'single-img') {
                flushTextBuffer();
                PAGINATED_PAGES.push({ type: 'single', data: '<img src="' + element.url + '">' });
                return;
            }
            let inlineMarkup = element.data;
            sandC.innerHTML = currentPageBuffer + inlineMarkup;
            if (sandC.scrollHeight > maxHeight && currentPageBuffer !== "") {
                PAGINATED_PAGES.push({ type: 'text', data: currentPageBuffer });
                currentPageBuffer = inlineMarkup;
            } else {
                currentPageBuffer += inlineMarkup;
            }
        });

        flushTextBuffer();
        sandbox.innerHTML = "";
        currentSpread = 0;
        updateUI();
    }

    function updateUI() {
        const container = document.getElementById('spread-content-area');
        container.innerHTML = "";
        if (PAGINATED_PAGES.length === 0) return;
        const isMobileView = window.innerWidth <= 900 && window.innerHeight > window.innerWidth;
        const bookSpreadElement = document.getElementById('spreadElement');
        if (isMobileView) {
            bookSpreadElement.style.display = "block"; bookSpreadElement.style.border = "none";
            const currentItem = PAGINATED_PAGES[currentSpread]; if (!currentItem) return;
            if (currentItem.type === 'single') { container.innerHTML = '<article class="page no-padding">' + currentItem.data + '</article>'; }
            else { container.innerHTML = '<article class="page"><div class="content">' + currentItem.data + '</div></article>'; }
            handleSpoilerState(container); return;
        }
        bookSpreadElement.style.display = "grid"; bookSpreadElement.style.border = "1px solid var(--border-light)";
        const leftIndex = currentSpread * 2; const rightIndex = leftIndex + 1;
        const leftPageData = PAGINATED_PAGES[leftIndex]; const rightPageData = PAGINATED_PAGES[rightIndex];
        let leftHtml = "";
        if (leftPageData) {
            if (leftPageData.type === 'single') leftHtml = '<article class="page no-padding" id="L-PAGE">' + leftPageData.data + '</article>';
            else if (leftPageData.type === 'text') leftHtml = '<article class="page" id="L-PAGE"><div class="content">' + leftPageData.data + '</div></article>';
            else leftHtml = '<article class="page" id="L-PAGE"></article>';
        } else { leftHtml = '<article class="page" id="L-PAGE"></article>'; }
        let rightHtml = "";
        if (rightPageData) {
            if (rightPageData.type === 'single') rightHtml = '<article class="page no-padding" id="R-PAGE">' + rightPageData.data + '</article>';
            else if (rightPageData.type === 'text') rightHtml = '<article class="page" id="R-PAGE"><div class="content">' + rightPageData.data + '</div></article>';
            else rightHtml = '<article class="page" id="R-PAGE"></article>';
        } else { rightHtml = '<article class="page" id="R-PAGE" style="display:none;"></article>'; }
        container.innerHTML = leftHtml + rightHtml;
        handleSpoilerState(container);
    }

    function handleSpoilerState(container) {
        const isSpoilerOn = localStorage.getItem('spoiler-mode') === 'true';
        const pages = container.querySelectorAll('.page');
        pages.forEach(page => {
            if (isSpoilerOn && page.classList.contains('no-padding')) {
                page.classList.add('spoiler-active');
                page.onclick = (e) => { if (page.classList.contains('spoiler-active') && !page.classList.contains('revealed')) { e.stopPropagation(); page.classList.add('revealed'); } };
            }
        });
    }

    function nextPage() {
        const isMobileView = window.innerWidth <= 900 && window.innerHeight > window.innerWidth;
        const activeSpoiler = document.querySelector('.spoiler-active:not(.revealed)');
        if (activeSpoiler) { activeSpoiler.classList.add('revealed'); return; }
        if (isMobileView) { if (currentSpread + 1 < PAGINATED_PAGES.length) { currentSpread++; updateUI(); window.scrollTo({ top: 0 }); } }
        else { if ((currentSpread + 1) * 2 < PAGINATED_PAGES.length) { currentSpread++; updateUI(); window.scrollTo({ top: 0 }); } }
    }

    function prevPage() { if (currentSpread > 0) { currentSpread--; updateUI(); window.scrollTo({ top: 0 }); } }

    function updateRatio(val) {
        if (val !== "1.33" && val !== "1.5" && val !== "1.25") val = "1.33";
        document.documentElement.style.setProperty('--spread-ratio', val);
        document.body.setAttribute('data-ratio', val);
        localStorage.setItem('individuals-ratio', val);
        setTimeout(() => reflowContent(), 100);
    }

    window.addEventListener('resize', () => setTimeout(() => reflowContent(), 100));

    window.onload = () => {
        if (localStorage.getItem('site-theme') === 'light') document.body.classList.add('light-theme');
        let saved = localStorage.getItem('individuals-ratio') || "1.33";
        if (saved !== "1.33" && saved !== "1.5" && saved !== "1.25") saved = "1.33";
        document.getElementById('ratioSelect').value = saved;
        updateRatio(saved);
    };</script>
